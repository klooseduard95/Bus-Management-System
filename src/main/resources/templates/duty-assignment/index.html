<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Duty Assignments')}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h1 class="mb-3">🧑‍✈️ Duty Assignments</h1>

        <a th:href="@{/duty-assignment/new}" class="btn btn-primary mb-3">
            Add New Assignment
        </a>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Trip ID</th>
                <th>Staff Member</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assignment : ${assignments}">

                <td>
                    <a th:href="@{/duty-assignment/{id}(id=${assignment.id})}"
                       th:text="${'#' + assignment.id}"
                       class="fw-bold text-decoration-none text-primary">
                        #1
                    </a>
                </td>

                <td>
                    <a th:if="${assignment.busTrip != null}"
                       th:href="@{/bus-trip/{id}(id=${assignment.busTrip.id})}"
                       th:text="${'#' + assignment.busTrip.id}"
                       class="text-decoration-none">
                        #100
                    </a>
                    <span th:unless="${assignment.busTrip != null}" class="text-danger">No Trip</span>
                </td>

                <td>
                    <span th:if="${assignment.staff != null}">
                        <a th:href="@{/staff/{id}(id=${assignment.staff.id})}"
                           th:text="${assignment.staff.name}"
                           class="text-decoration-none text-dark fw-bold">
                            Name
                        </a>
                    </span>
                    <span th:unless="${assignment.staff != null}" class="text-danger">No Staff</span>
                </td>

                <td>
                    <span class="badge"
                          th:classappend="${assignment.role.name() == 'PrimaryDriver' ? 'bg-primary' : 'bg-secondary'}"
                          th:text="${assignment.role}">
                        Role
                    </span>
                </td>

                <td>
                    <a th:href="@{/duty-assignment/{id}/edit(id=${assignment.id})}"
                       class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>
                    <form th:action="@{/duty-assignment/{id}/delete(id=${assignment.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this assignment?');">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
