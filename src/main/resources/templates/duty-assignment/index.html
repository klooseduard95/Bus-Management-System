<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Duty Assignments')}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h1 class="mb-3">Duty Assignments</h1>

        <a th:href="@{/duty-assignment/new}" class="btn btn-primary mb-3">
            Add New Assignment
        </a>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Trip ID</th>
                <th>Staff ID</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assignment : ${assignments}">
                <td th:text="${assignment.tripId}">[Trip ID]</td>
                <td th:text="${assignment.staffId}">[Staff ID]</td>
                <td th:text="${assignment.role}">[Role]</td>
                <td>
                    <a th:href="@{/duty-assignment/{id}/edit(id=${assignment.id})}"
                       class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>
                    <form th:action="@{/duty-assignment/{id}/delete(id=${assignment.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
