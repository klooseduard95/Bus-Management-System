<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title=${driver.id == null ? 'Create Driver' : 'Edit Driver'})}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">

        <h1 th:text="${driver.id == null ? 'Create New Driver' : 'Edit Driver'}">Formular Driver</h1>

        <form th:action="@{/staff/driver}" th:object="${driver}" method="post" class="col-md-6">

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" />
            </div>

            <div class="mb-3">
                <label for="yearsOfExperience" class="form-label">Years Of Experience:</label>
                <input type="number" id="yearsOfExperience" th:field="*{yearsOfExperience}" class="form-control" />
            </div>

            <div>
                <button type="submit" class="btn btn-success me-2"
                        th:text="${driver.id == null ? 'Save Driver' : 'Update Driver'}">
                    Save
                </button>
                <a th:href="@{/staff}" class="btn btn-secondary">Back to List</a>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
