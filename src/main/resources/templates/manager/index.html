<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Manager List')}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h1 class="mb-3">👔 Trip Manager Management</h1>

        <div class="card bg-light mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/manager}" method="get" class="row g-3 align-items-end">

                    <input type="hidden" name="sortField" th:value="${sortField}">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">

                    <div class="col-md-4">
                        <label for="name" class="form-label fw-bold">Name:</label>
                        <input type="text" class="form-control" id="name" name="name"
                               th:value="${name}" placeholder="Search name...">
                    </div>

                    <div class="col-md-4">
                        <label for="employeeCode" class="form-label fw-bold">Employee Code:</label>
                        <input type="text" class="form-control" id="employeeCode" name="employeeCode"
                               th:value="${employeeCode}" placeholder="e.g. CODE123">
                    </div>

                    <div class="col-md-4">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-search"></i> Filter
                            </button>
                            <a th:href="@{/manager}" class="btn btn-outline-secondary">
                                Clear
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <a th:href="@{/manager/new}" class="btn btn-info mb-3 text-white">
            <i class="bi bi-plus-circle"></i> Add New Manager
        </a>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>
                    <a th:href="@{/manager(sortField='id', sortDir=${reverseSortDir}, name=${name}, employeeCode=${employeeCode})}"
                       class="text-white text-decoration-none">
                        ID <i th:if="${sortField == 'id'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>
                    <a th:href="@{/manager(sortField='name', sortDir=${reverseSortDir}, name=${name}, employeeCode=${employeeCode})}"
                       class="text-white text-decoration-none">
                        Name <i th:if="${sortField == 'name'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>
                    <a th:href="@{/manager(sortField='employeeCode', sortDir=${reverseSortDir}, name=${name}, employeeCode=${employeeCode})}"
                       class="text-white text-decoration-none">
                        Employee Code <i th:if="${sortField == 'employeeCode'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${managers.empty}">
                <td colspan="4" class="text-center text-muted py-4">No managers found.</td>
            </tr>
            <tr th:each="m : ${managers}">
                <td>
                    <a th:href="@{/manager/{id}(id=${m.id})}"
                       class="fw-bold text-decoration-none text-primary"
                       th:text="${'#' + m.id}">
                        #1
                    </a>
                </td>

                <td th:text="${m.name}">[Name]</td>

                <td>
                    <span class="badge bg-dark font-monospace"
                          th:text="${m.employeeCode}">
                        CODE123
                    </span>
                </td>

                <td>
                    <a th:href="@{/manager/{id}/edit(id=${m.id})}"
                       class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>

                    <form th:action="@{/manager/{id}/delete(id=${m.id})}"
                          method="post" class="d-inline"
                          onsubmit="return confirm('Are you sure you want to delete this manager?');">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
