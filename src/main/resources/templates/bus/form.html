<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title=${bus.id == null ? 'Create Bus' : 'Edit Bus'})}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">

        <h1 th:text="${bus.id == null ? 'Create New Bus' : 'Edit Bus'}">Formular Bus</h1>

        <form th:action="@{/bus}" th:object="${bus}" method="post" class="col-md-6">

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="registrationNumber" class="form-label">Registration Number:</label>
                <input type="text" id="registrationNumber" th:field="*{registrationNumber}" class="form-control" />
                <span class="text-danger" th:if="${#fields.hasErrors('registrationNumber')}" th:errors="*{registrationNumber}"></span>
            </div>

            <div class="mb-3">
                <label for="capacity" class="form-label">Capacity:</label>
                <input type="number" id="capacity" th:field="*{capacity}" class="form-control" />
                <span class="text-danger" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></span>
            </div>

            <div class="mb-3">
                <label for="status" class="form-label">Status:</label>
                <select id="status" th:field="*{status}" class="form-select">
                    <option th:each="stat : ${T(bus.station.enums.BusStatus).values()}"
                            th:value="${stat}"
                            th:text="${stat}">
                        Active
                    </option>
                </select>
            </div>
            <div class="mb-3">
                <label for="lastMaintenanceDate" class="form-label">Last Maintenance Date:</label>
                <input type="date" id="lastMaintenanceDate"
                       name="lastMaintenanceDate"
                       th:value="${bus.lastMaintenanceDate != null ? #temporals.format(bus.lastMaintenanceDate, 'yyyy-MM-dd') : ''}"
                       class="form-control" />
                <span class="text-danger" th:if="${#fields.hasErrors('lastMaintenanceDate')}" th:errors="*{lastMaintenanceDate}"></span>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" id="hasAccessibilitySupport" th:field="*{hasAccessibilitySupport}" class="form-check-input" />
                <label for="hasAccessibilitySupport" class="form-check-label">Has Accessibility Support</label>
            </div>

            <div>
                <button type="submit" class="btn btn-success me-2"
                        th:text="${bus.id == null ? 'Save Bus' : 'Update Bus'}">
                    Save
                </button>
                <a th:href="@{/bus}" class="btn btn-secondary">Back to List</a>
            </div>
        </form>
    </div>
</div>
<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
