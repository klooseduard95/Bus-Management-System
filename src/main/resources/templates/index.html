<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Dashboard')}"></head>

<body>
<div class="d-flex">

    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-5 bg-light">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="display-5 fw-bold text-dark">Welcome to Bus Admin! 👋</h1>
                <p class="fs-5 text-muted">System Overview & Fleet Status</p>
            </div>
            <div>
                <span class="badge bg-success fs-5">
                    <i class="bi bi-broadcast"></i> <span th:text="${activeTrips.size()}">0</span> Active Trips
                </span>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-5">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-globe-europe-africa"></i> Live Fleet Map</h5>
            </div>
            <div class="card-body p-0">
                <div id="fleetMap" style="height: 500px; width: 100%;"></div>
            </div>
        </div>
        <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
            <div class="col">
                <div class="card h-100 border-0 shadow-sm hover-card">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-truck-front display-4 text-primary mb-3"></i>
                        <h3 class="card-title">Buses</h3>
                        <a th:href="@{/bus}" class="btn btn-outline-primary stretched-link">Go to Buses</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 border-0 shadow-sm hover-card">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-map display-4 text-success mb-3"></i>
                        <h3 class="card-title">Routes</h3>
                        <a th:href="@{/route}" class="btn btn-outline-success stretched-link">Go to Routes</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 border-0 shadow-sm hover-card">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-calendar-week display-4 text-warning mb-3"></i>
                        <h3 class="card-title">Trips</h3>
                        <a th:href="@{/bus-trip}" class="btn btn-outline-warning stretched-link">Go to Trips</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 border-0 shadow-sm hover-card">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-person-badge display-4 text-info mb-3"></i>
                        <h3 class="card-title">Staff</h3>
                        <a th:href="@{/driver}" class="btn btn-outline-info stretched-link">Go to Staff</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 border-0 shadow-sm hover-card">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-ticket-perforated display-4 text-danger mb-3"></i>
                        <h3 class="card-title">Tickets</h3>
                        <a th:href="@{/ticket}" class="btn btn-outline-danger stretched-link">Go to Tickets</a>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 border-0 shadow-sm hover-card">
                    <div class="card-body text-center p-4">
                        <i class="bi bi-clipboard-check display-4 text-secondary mb-3"></i>
                        <h3 class="card-title">Assignments</h3>
                        <a th:href="@{/duty-assignment}" class="btn btn-outline-secondary stretched-link">Go to Assignments</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .hover-card { transition: transform 0.2s; }
    .hover-card:hover { transform: translateY(-5px); }
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/

    var activeTripsData = [];

    /*[# th:each="trip : ${activeTrips}"]*/
    /*[# th:if="${trip.route != null && trip.route.origin != null && trip.route.destination != null}"]*/
    activeTripsData.push({
        id: /*[[${trip.id}]]*/ 0,
        busRegistration: /*[[${trip.bus.registrationNumber}]]*/ 'Unknown',
        originName: /*[[${trip.route.origin.name}]]*/ 'A',
        destName: /*[[${trip.route.destination.name}]]*/ 'B',
        originLat: /*[[${trip.route.origin.latitude}]]*/ 0.0,
        originLng: /*[[${trip.route.origin.longitude}]]*/ 0.0,
        destLat: /*[[${trip.route.destination.latitude}]]*/ 0.0,
        destLng: /*[[${trip.route.destination.longitude}]]*/ 0.0,
        progress: /*[[${trip.progressFactor}]]*/ 0.0
    });
    /*[/]*/
    /*[/]*/

    var map = L.map('fleetMap').setView([45.9432, 24.9668], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    var busIcon = L.divIcon({
        html: '<i class="bi bi-bus-front-fill" style="font-size: 1.5rem; color: #d63384; text-shadow: 1px 1px 2px white; cursor: pointer;"></i>',
        className: 'custom-bus-icon',
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    });

    if (activeTripsData.length === 0) {
        console.log("No active trips to display.");
    }

    activeTripsData.forEach(function(trip) {
        if (!trip.originLat || !trip.destLat) return;

        var origin = L.latLng(trip.originLat, trip.originLng);
        var dest = L.latLng(trip.destLat, trip.destLng);

        L.Routing.control({
            waypoints: [origin, dest],
            routeWhileDragging: false,
            draggableWaypoints: false,
            addWaypoints: false,
            show: false,
            createMarker: function() { return null; },
            lineOptions: {
                styles: [{color: 'blue', opacity: 0, weight: 0}]
            }
        }).on('routesfound', function(e) {
            var route = e.routes[0];
            var coordinates = route.coordinates;
            var totalPoints = coordinates.length;

            var targetIndex = Math.floor(totalPoints * trip.progress);
            if(targetIndex >= totalPoints) targetIndex = totalPoints - 1;
            if(targetIndex < 0) targetIndex = 0;

            var busLatLng = coordinates[targetIndex];

            var marker = L.marker(busLatLng, {icon: busIcon}).addTo(map);

            var detailsUrl = '/bus-trip/' + trip.id;

            marker.bindPopup(
                `<div class="text-center">
                    <strong>Trip #${trip.id}</strong><br>
                    <span class="text-muted small">${trip.busRegistration}</span><br>
                    ${trip.originName} <i class="bi bi-arrow-right"></i> ${trip.destName}<br>

                    <div class="mt-2">
                        <a href="${detailsUrl}" class="btn btn-sm btn-primary text-white text-decoration-none">
                            <i class="bi bi-eye"></i> View Trip
                        </a>
                    </div>
                 </div>`
            );
        }).addTo(map);
    });
    /*]]>*/
</script>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
