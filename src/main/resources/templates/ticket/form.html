<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title=${ticket.id == null ? 'Issue' : 'Edit'} + ' Ticket')}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h1 th:text="${ticket.id == null ? 'Issue New Ticket' : 'Edit Ticket'}">Formular Bilet</h1>

        <form th:action="@{/ticket}" th:object="${ticket}" method="post" class="col-md-6">

            <div th:if="${globalError}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${globalError}">Error message</span>
            </div>

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="busTrip" class="form-label">Select Trip:</label>
                <select id="busTrip" th:field="*{busTrip}" class="form-select" required>
                    <option value="">-- Select Trip --</option>
                    <option th:each="trip : ${allTrips}"
                            th:value="${trip.id}"
                            th:text="${'#' + trip.id + ' | ' + (trip.route != null ? trip.route.origin.city + ' -> ' + trip.route.destination.city : 'Unknown Route') + ' (' + trip.startTime + ') - Seats: ' + trip.availableSeats}">
                        [Trip Details]
                    </option>
                </select>
                <span class="text-danger" th:if="${#fields.hasErrors('busTrip')}" th:errors="*{busTrip}"></span>
            </div>

            <div class="mb-3">
                <label for="passenger" class="form-label">Passenger:</label>
                <select id="passenger" th:field="*{passenger}" class="form-select" required>
                    <option value="">-- Select Passenger --</option>
                    <option th:each="p : ${allPassengers}"
                            th:value="${p.id}"
                            th:text="${p.name + ' (ID: ' + p.id + ')'}">
                        [Passenger Name]
                    </option>
                </select>
                <span class="text-danger" th:if="${#fields.hasErrors('passenger')}" th:errors="*{passenger}"></span>
            </div>

            <div class="mb-3">
                <label for="seatNumber" class="form-label">Seat Number:</label>
                <input type="text" id="seatNumber" th:field="*{seatNumber}" class="form-control" required />
                <span class="text-danger" th:if="${#fields.hasErrors('seatNumber')}" th:errors="*{seatNumber}"></span>
            </div>

            <div class="mb-3">
                <label for="price" class="form-label">Price:</label>
                <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" readonly />
                <div class="form-text">Price is calculated automatically upon saving (based on trip price and passenger age).</div>
                <span class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
            </div>

            <div>
                <button type="submit" class="btn btn-success me-2"
                        th:text="${ticket.id == null ? 'Issue Ticket' : 'Update Ticket'}">
                    Save
                </button>
                <a th:href="@{/ticket}" class="btn btn-secondary">Back to List</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
