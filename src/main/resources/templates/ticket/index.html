<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Ticket List')}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h1 class="mb-3">🎟️ Ticket Management</h1>

        <a th:href="@{/ticket/new}" class="btn btn-primary mb-3">
            Issue New Ticket
        </a>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Trip Info</th>
                <th>Passenger</th>
                <th>Seat Number</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ticket : ${tickets}">

                <td>
                    <a th:href="@{/ticket/{id}(id=${ticket.id})}"
                       th:text="${'#' + ticket.id}"
                       class="fw-bold text-decoration-none text-primary">
                        #1
                    </a>
                </td>

                <td>
                    <span th:if="${ticket.busTrip != null}">
                        <a th:href="@{/bus-trip/{id}(id=${ticket.busTrip.id})}"
                           class="text-decoration-none">
                           Trip #<span th:text="${ticket.busTrip.id}">123</span>
                        </a>
                        <small class="text-muted d-block"
                               th:if="${ticket.busTrip.route != null}"
                               th:text="${ticket.busTrip.route.origin.city + ' -> ' + ticket.busTrip.route.destination.city}">
                            Buc -> Cluj
                        </small>
                    </span>
                    <span th:unless="${ticket.busTrip != null}" class="text-danger">No Trip</span>
                </td>

                <td>
                    <span th:if="${ticket.passenger != null}">
                        <a th:href="@{/passenger/{id}(id=${ticket.passenger.id})}"
                           th:text="${ticket.passenger.name}"
                           class="text-decoration-none text-dark fw-bold">
                            Ion Popescu
                        </a>
                    </span>
                    <span th:unless="${ticket.passenger != null}" class="text-danger">No Passenger</span>
                </td>

                <td th:text="${ticket.seatNumber}">[Seat]</td>
                <td th:text="${#numbers.formatCurrency(ticket.price)}">[Price]</td>

                <td>
                    <a th:href="@{/ticket/{id}/edit(id=${ticket.id})}"
                       class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>
                    <form th:action="@{/ticket/{id}/delete(id=${ticket.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Cancel this ticket?');">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
