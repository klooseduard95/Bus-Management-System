<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Ticket List')}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h1 class="mb-3">🎟️ Ticket Management</h1>

        <div class="card bg-light mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/ticket}" method="get" class="row g-3 align-items-end">

                    <input type="hidden" name="sortField" th:value="${sortField}">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">

                    <div class="col-md-3">
                        <label for="tripId" class="form-label fw-bold">Trip ID:</label>
                        <input type="number" class="form-control" id="tripId" name="tripId"
                               th:value="${tripId}" placeholder="e.g. 5">
                    </div>

                    <div class="col-md-3">
                        <label for="passengerName" class="form-label fw-bold">Passenger Name:</label>
                        <input type="text" class="form-control" id="passengerName" name="passengerName"
                               th:value="${passengerName}" placeholder="Search passenger...">
                    </div>

                    <div class="col-md-3">
                        <label for="maxPrice" class="form-label fw-bold">Max Price:</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" id="maxPrice" name="maxPrice"
                                   th:value="${maxPrice}" placeholder="Max budget">
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-funnel"></i> Apply
                            </button>
                            <a th:href="@{/ticket}" class="btn btn-outline-secondary">
                                Clear
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <a th:href="@{/ticket/new}" class="btn btn-primary mb-3">
            Issue New Ticket
        </a>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>
                    <a th:href="@{/ticket(sortField='id', sortDir=${reverseSortDir}, tripId=${tripId}, passengerName=${passengerName}, maxPrice=${maxPrice})}"
                       class="text-white text-decoration-none">
                        ID <i th:if="${sortField == 'id'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>Trip Info</th>

                <th>
                    <a th:href="@{/ticket(sortField='passenger.name', sortDir=${reverseSortDir}, tripId=${tripId}, passengerName=${passengerName}, maxPrice=${maxPrice})}"
                       class="text-white text-decoration-none">
                        Passenger <i th:if="${sortField == 'passenger.name'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>
                    <a th:href="@{/ticket(sortField='seatNumber', sortDir=${reverseSortDir}, tripId=${tripId}, passengerName=${passengerName}, maxPrice=${maxPrice})}"
                       class="text-white text-decoration-none">
                        Seat Number <i th:if="${sortField == 'seatNumber'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>
                    <a th:href="@{/ticket(sortField='price', sortDir=${reverseSortDir}, tripId=${tripId}, passengerName=${passengerName}, maxPrice=${maxPrice})}"
                       class="text-white text-decoration-none">
                        Price <i th:if="${sortField == 'price'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${tickets.empty}">
                <td colspan="6" class="text-center text-muted py-4">No tickets found.</td>
            </tr>
            <tr th:each="ticket : ${tickets}">

                <td>
                    <a th:href="@{/ticket/{id}(id=${ticket.id})}"
                       th:text="${'#' + ticket.id}"
                       class="fw-bold text-decoration-none text-primary">
                        #1
                    </a>
                </td>

                <td>
                    <span th:if="${ticket.busTrip != null}">
                        <a th:href="@{/bus-trip/{id}(id=${ticket.busTrip.id})}"
                           class="text-decoration-none">
                           Trip #<span th:text="${ticket.busTrip.id}">123</span>
                        </a>
                        <small class="text-muted d-block"
                               th:if="${ticket.busTrip.route != null}"
                               th:text="${ticket.busTrip.route.origin.city + ' -> ' + ticket.busTrip.route.destination.city}">
                            Buc -> Cluj
                        </small>
                    </span>
                    <span th:unless="${ticket.busTrip != null}" class="text-danger">No Trip</span>
                </td>

                <td>
                    <span th:if="${ticket.passenger != null}">
                        <a th:href="@{/passenger/{id}(id=${ticket.passenger.id})}"
                           th:text="${ticket.passenger.name}"
                           class="text-decoration-none text-dark fw-bold">
                            Ion Popescu
                        </a>
                    </span>
                    <span th:unless="${ticket.passenger != null}" class="text-danger">No Passenger</span>
                </td>

                <td th:text="${ticket.seatNumber}">[Seat]</td>
                <td th:text="${#numbers.formatCurrency(ticket.price)}">[Price]</td>

                <td>
                    <a th:href="@{/ticket/{id}/edit(id=${ticket.id})}"
                       class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>
                    <form th:action="@{/ticket/{id}/delete(id=${ticket.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Cancel this ticket?');">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
