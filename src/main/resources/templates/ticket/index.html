<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Ticket List')}"></head>

<body>

<div class="d-flex">

    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">

        <h1 class="mb-3">🎟️ Tickets</h1>

        <a th:href="@{/ticket/new}" class="btn btn-primary mb-3">
            Add New Ticket
        </a>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Trip</th>
                <th>Passenger</th>
                <th>Seat Number</th>
                <th>Price</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${bus.registrationNumber}">[Reg Number]</td>
                <td th:text="${bus.capacity}">[Capacity]</td>
                <td th:text="${bus.status}">[Status]</td>
                <td th:text="${bus.lastMaintenanceDate}">[Maintenance]</td>
                <td th:text="${bus.hasAccessibilitySupport} ? 'Yes' : 'No'">[Access]</td>
                <td>
                    <a th:href="@{/bus/{id}/edit(id=${bus.id})}"
                       class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>
                    <form th:action="@{/bus/{id}/delete(id=${bus.id})}" method="post">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
