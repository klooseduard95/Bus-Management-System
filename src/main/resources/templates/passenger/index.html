<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Passenger List')}"></head>

<body>

<div class="d-flex">

    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">

        <h1 class="mb-3">🧑 Pasageri (Passengers)</h1>

        <a th:href="@{/passenger/new}" class="btn btn-primary mb-3">
            Add New Passenger
        </a>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Currency</th>
                <th>Tickets</th>
                <th>Date of birth</th>
                <th>Requires special assistance</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="passenger : ${passengers}">
                <td th:text="${passenger.name}">[Name]</td>
                <td th:text="${passenger.currency}">[Currency]</td>
                <td th:text="${passenger.tickets}">[Tickets]</td>
                <td th:text="${passenger.dateOfBirth}">[Date of birth]</td>
                <td th:text="${passenger.requiresSpecialAssistance} ? 'Yes' : 'No'">[Requires special assistance]</td>
                <td>
                    <a th:href="@{/passenger/{id}/edit(id=${passenger.id})}"
                       class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>
                    <form th:action="@{/passenger/{id}/delete(id=${passenger.id})}" method="post">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
