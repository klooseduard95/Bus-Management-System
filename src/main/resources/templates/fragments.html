<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head-links(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Bus Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <style>
        body { min-height: 100vh; }
        .sidebar { min-height: 100vh; }
    </style>
</head>

<body>

<div th:fragment="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark" style="width: 280px;">
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
        <span class="fs-4">Bus Station Admin</span>
    </a>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
            <a th:href="@{/bus}" class="nav-link text-white" aria-current="page">
                🚌 Autobuze (Buses)
            </a>
        </li>
        <li>
            <a th:href="@{/bus-station}" class="nav-link text-white">
                🚉 Stații (BusStations)
            </a>
        </li>
        <li>
            <a th:href="@{/route}" class="nav-link text-white">
                Routes
            </a>
        </li>
        <li>
            <a th:href="@{/passenger}" class="nav-link text-white">
                🧑 Pasageri (Passengers)
            </a>
        </li>
        <li>
            <a th:href="@{/bus-trip}" class="nav-link text-white">
                🗺️ Curse (BusTrips)
            </a>
        </li>
    </ul>
    <hr>
</div>

<div th:fragment="body-scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</div>

</body>
</html>
