<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Bus Trip List')}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h1 class="mb-3">🗺️ Bus Trip Management</h1>

        <a th:href="@{/bus-trip/new}" class="btn btn-primary mb-3">
            Add New Bus Trip
        </a>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Route ID</th>
                <th>Bus ID</th>
                <th>Start Time</th>
                <th>Available Seats</th>
                <th>Base Price</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="trip : ${busTrips}">
                <td th:text="${trip.routeId}">[Route ID]</td>
                <td th:text="${trip.busId}">[Bus ID]</td>
                <td th:text="${trip.startTime}">[Start Time]</td>
                <td th:text="${trip.availableSeats}">[Seats]</td>
                <td th:text="${'$' + trip.basePrice}">[Price]</td>
                <td th:text="${trip.status}">[Status]</td>
                <td>
                    <a th:href="@{/bus-trip/{id}/edit(id=${trip.id})}"
                       class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>
                    <form th:action="@{/bus-trip/{id}/delete(id=${trip.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
