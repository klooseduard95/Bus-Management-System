<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Bus Trip List')}"></head>

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h1 class="mb-3">🛣️ Bus Trip Management</h1>

        <div class="card bg-light mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/bus-trip}" method="get" class="row g-3 align-items-end">

                    <input type="hidden" name="sortField" th:value="${sortField}">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">

                    <div class="col-md-3">
                        <label class="form-label fw-bold">Departure Time:</label>
                        <div class="input-group">
                            <input type="time" class="form-control" name="startTimeFrom" th:value="${startTimeFrom}" aria-label="From">
                            <span class="input-group-text">-</span>
                            <input type="time" class="form-control" name="startTimeTo" th:value="${startTimeTo}" aria-label="To">
                        </div>
                    </div>

                    <div class="col-md-3">
                        <label for="status" class="form-label fw-bold">Status:</label>
                        <select class="form-select" id="status" name="status">
                            <option value="">All Statuses</option>

                            <option th:each="s : ${T(bus.station.enums.BusTripStatus).values()}"
                                    th:value="${s}"
                                    th:text="${s}"
                                    th:selected="${status != null and s.name() == status.name()}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="maxPrice" class="form-label fw-bold">Max Price:</label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="number" step="0.01" class="form-control" id="maxPrice" name="maxPrice"
                                   th:value="${maxPrice}" placeholder="Max budget">
                        </div>
                    </div>

                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100 mb-2">
                            <i class="bi bi-funnel"></i> Apply Filters
                        </button>
                        <a th:href="@{/bus-trip}" class="btn btn-outline-secondary w-100">
                            Reset
                        </a>
                    </div>
                </form>
            </div>
        </div>
        <a th:href="@{/bus-trip/new}" class="btn btn-primary mb-3">Add New Bus Trip</a>

        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>
                    <a th:href="@{/bus-trip(sortField='id', sortDir=${reverseSortDir}, startTimeFrom=${startTimeFrom}, startTimeTo=${startTimeTo}, status=${status}, maxPrice=${maxPrice})}"
                       class="text-white text-decoration-none">
                        Trip ID <i th:if="${sortField == 'id'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>Route Info</th>
                <th>Bus</th>

                <th>
                    <a th:href="@{/bus-trip(sortField='startTime', sortDir=${reverseSortDir}, startTimeFrom=${startTimeFrom}, startTimeTo=${startTimeTo}, status=${status}, maxPrice=${maxPrice})}"
                       class="text-white text-decoration-none">
                        Start Time <i th:if="${sortField == 'startTime'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>Status</th>

                <th>
                    <a th:href="@{/bus-trip(sortField='basePrice', sortDir=${reverseSortDir}, startTimeFrom=${startTimeFrom}, startTimeTo=${startTimeTo}, status=${status}, maxPrice=${maxPrice})}"
                       class="text-white text-decoration-none">
                        Price <i th:if="${sortField == 'basePrice'}" th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${busTrips.empty}">
                <td colspan="7" class="text-center text-muted py-4">No trips found matching criteria.</td>
            </tr>
            <tr th:each="trip : ${busTrips}">
                <td>
                    <a th:href="@{/bus-trip/{id}(id=${trip.id})}"
                       th:text="${'#' + trip.id}"
                       class="fw-bold text-decoration-none text-primary">#1</a>
                </td>

                <td>
                    <span th:if="${trip.route != null}">
                        <a th:href="@{/route/{id}(id=${trip.route.id})}" class="text-decoration-none fw-bold text-dark">
                             #<span th:text="${trip.route.id}">4</span>
                        </a>
                        <small class="text-muted d-block">
                            <span th:text="${trip.route.origin.city}">A</span> -> <span th:text="${trip.route.destination.city}">B</span>
                        </small>
                    </span>
                    <span th:unless="${trip.route != null}" class="text-danger">No Route</span>
                </td>

                <td>
                    <span th:if="${trip.bus != null}" th:text="${trip.bus.registrationNumber}">CJ-01</span>
                    <span th:unless="${trip.bus != null}" class="text-danger">No Bus</span>
                </td>

                <td th:text="${trip.startTime}">12:00</td>

                <td>
                    <span class="badge"
                          th:classappend="${trip.status.name() == 'Active' ? 'bg-success' : 'bg-secondary'}"
                          th:text="${trip.status}">Planned</span>
                </td>

                <td th:text="${#numbers.formatCurrency(trip.basePrice)}">$10.00</td>

                <td>
                    <a th:href="@{/bus-trip/{id}/edit(id=${trip.id})}" class="btn btn-warning btn-sm me-2">Edit</a>
                    <form th:action="@{/bus-trip/{id}/delete(id=${trip.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Delete this trip?');">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
