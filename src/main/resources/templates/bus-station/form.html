<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title=${busStation.id == null ? 'Create' : 'Edit'} + ' Bus Station')}"></head>

<body>
<div class="d-flex">

    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">

        <h1 th:text="${busStation.id == null ? 'Create New Station' : 'Edit Station'}">Formular Stație</h1>

        <form th:action="@{/bus-station}" th:object="${busStation}" method="post" class="col-md-6">

            <div th:if="${globalError}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${globalError}">Error message</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="name" class="form-label">Station Name:</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" />
                <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="mb-3">
                <label for="city" class="form-label">City:</label>
                <input type="text" id="city" th:field="*{city}" class="form-control" />
                <span class="text-danger" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
            </div>

            <div>
                <button type="submit" class="btn btn-success me-2"
                        th:text="${busStation.id == null ? 'Save Station' : 'Update Station'}">
                    Save
                </button>
                <a th:href="@{/bus-station}" class="btn btn-secondary">Back to List</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
