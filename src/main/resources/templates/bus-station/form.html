<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title=${busStation.id == null ? 'Create' : 'Edit'} + ' Station')}"></head>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />

<body>
<div class="d-flex">
    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">
        <h1 th:text="${busStation.id == null ? 'Create New Station' : 'Edit Station'}">Formular Stație</h1>

        <form th:action="@{/bus-station}" th:object="${busStation}" method="post" class="row g-3">

            <input type="hidden" th:field="*{id}" />

            <div class="col-md-6">
                <label for="name" class="form-label">Station Name:</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. Autogara Centrala" required />
                <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="col-md-6">
                <label for="city" class="form-label">City:</label>
                <input type="text" id="city" th:field="*{city}" class="form-control" placeholder="e.g. Cluj-Napoca" required />
                <span class="text-danger" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
            </div>

            <hr class="my-4">

            <div class="col-12">
                <label class="form-label fw-bold"><i class="bi bi-geo-alt-fill text-danger"></i> Pinpoint Location on Map:</label>
                <p class="text-muted small">Search for a place or click on the map to set coordinates automatically.</p>

                <div id="mapPicker" class="rounded shadow-sm border" style="height: 400px; width: 100%;"></div>
            </div>

            <div class="col-md-6">
                <label for="latitude" class="form-label">Latitude:</label>
                <input type="number" step="any" id="latitude" th:field="*{latitude}" class="form-control" readonly required />
                <span class="text-danger" th:if="${#fields.hasErrors('latitude')}" th:errors="*{latitude}"></span>
            </div>

            <div class="col-md-6">
                <label for="longitude" class="form-label">Longitude:</label>
                <input type="number" step="any" id="longitude" th:field="*{longitude}" class="form-control" readonly required />
                <span class="text-danger" th:if="${#fields.hasErrors('longitude')}" th:errors="*{longitude}"></span>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-success me-2"
                        th:text="${busStation.id == null ? 'Save Station' : 'Update Station'}">
                    Save
                </button>
                <a th:href="@{/bus-station}" class="btn btn-secondary">Back to List</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/

    var existingLat = /*[[${busStation.latitude}]]*/ null;
    var existingLng = /*[[${busStation.longitude}]]*/ null;

    var defaultLat = 46.0;
    var defaultLng = 25.0;
    var zoomLevel = 7;

    var mapLat = existingLat || defaultLat;
    var mapLng = existingLng || defaultLng;
    if(existingLat) zoomLevel = 15;

    var map = L.map('mapPicker').setView([mapLat, mapLng], zoomLevel);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    L.Control.geocoder({
        defaultMarkGeocode: false
    })
        .on('markgeocode', function(e) {
            var bbox = e.geocode.bbox;
            var poly = L.polygon([
                bbox.getSouthEast(),
                bbox.getNorthEast(),
                bbox.getNorthWest(),
                bbox.getSouthWest()
            ]);
            map.fitBounds(poly.getBounds());

            updateMarker(e.geocode.center.lat, e.geocode.center.lng);
        })
        .addTo(map);

    var marker;

    function updateMarker(lat, lng) {
        document.getElementById('latitude').value = lat;
        document.getElementById('longitude').value = lng;

        if (marker) {
            marker.setLatLng([lat, lng]);
        } else {
            marker = L.marker([lat, lng], {draggable: true}).addTo(map);

            marker.on('dragend', function(e) {
                var position = marker.getLatLng();
                document.getElementById('latitude').value = position.lat;
                document.getElementById('longitude').value = position.lng;
            });
        }
    }

    if (existingLat && existingLng) {
        updateMarker(existingLat, existingLng);
    }

    map.on('click', function(e) {
        updateMarker(e.latlng.lat, e.latlng.lng);
    });

    /*]]>*/
</script>

</body>
</html>
