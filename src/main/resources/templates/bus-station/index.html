<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head-links(title='Bus Station List')}"></head>

<body>
<div class="d-flex">

    <div th:replace="~{fragments :: sidebar}"></div>

    <div class="container-fluid p-4">

        <h1 class="mb-3">🚉 Bus Station Management</h1>

        <div class="card bg-light mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/bus-station}" method="get" class="row g-3 align-items-end">

                    <input type="hidden" name="sortField" th:value="${sortField}">
                    <input type="hidden" name="sortDir" th:value="${sortDir}">

                    <div class="col-md-4">
                        <label for="name" class="form-label fw-bold">Station Name:</label>
                        <input type="text" class="form-control" id="name" name="name"
                               th:value="${name}" placeholder="Search name...">
                    </div>

                    <div class="col-md-4">
                        <label for="city" class="form-label fw-bold">City:</label>
                        <input type="text" class="form-control" id="city" name="city"
                               th:value="${city}" placeholder="Search city...">
                    </div>

                    <div class="col-md-4">
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-search"></i> Filter
                            </button>
                            <a th:href="@{/bus-station}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> Clear
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <a th:href="@{/bus-station/new}" class="btn btn-primary mb-3">
            Add New Station
        </a>

        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>
                    <a th:href="@{/bus-station(sortField='id', sortDir=${reverseSortDir}, name=${name}, city=${city})}"
                       class="text-white text-decoration-none">
                        ID <i th:if="${sortField == 'id'}"
                              th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>
                    <a th:href="@{/bus-station(sortField='name', sortDir=${reverseSortDir}, name=${name}, city=${city})}"
                       class="text-white text-decoration-none">
                        Name <i th:if="${sortField == 'name'}"
                                th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>
                    <a th:href="@{/bus-station(sortField='city', sortDir=${reverseSortDir}, name=${name}, city=${city})}"
                       class="text-white text-decoration-none">
                        City <i th:if="${sortField == 'city'}"
                                th:class="${sortDir == 'asc' ? 'bi bi-arrow-up' : 'bi bi-arrow-down'}"></i>
                    </a>
                </th>

                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${busStations.empty}">
                <td colspan="4" class="text-center text-muted py-4">No stations found.</td>
            </tr>
            <tr th:each="station : ${busStations}">

                <td>
                    <a th:href="@{/bus-station/{id}(id=${station.id})}"
                       th:text="${'#' + station.id}"
                       class="fw-bold text-decoration-none text-primary">
                        #1
                    </a>
                </td>

                <td th:text="${station.name}">[Name]</td>
                <td th:text="${station.city}">[City]</td>
                <td>
                    <a th:href="@{/bus-station/{id}/edit(id=${station.id})}"
                       class="btn btn-warning btn-sm me-2">
                        Edit
                    </a>

                    <form th:action="@{/bus-station/{id}/delete(id=${station.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Are you sure you want to delete this station?');">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments :: body-scripts}"></div>
</body>
</html>
